<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UoB MLA traffic lights explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --bg-elevated: #1a2332;
      --bg-card: #1e2a3a;
      --bg-hover: #263447;
      --border: #2d3a4f;
      --text: #e8eef7;
      --text-muted: #8b9bb4;
      --text-dim: #5c6b82;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --high: #22c55e;
      --high-bg: rgba(34, 197, 94, 0.15);
      --medium: #f59e0b;
      --medium-bg: rgba(245, 158, 11, 0.15);
      --low: #ef4444;
      --low-bg: rgba(239, 68, 68, 0.15);
      --tag-bg: #2a3a52;
      --tag-text: #a8c0e0;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 197, 94, 0.06), transparent);
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    /* Header */
    header {
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header h1 span.logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      border-radius: 10px;
      font-size: 1.1rem;
    }
    header p {
      color: var(--text-muted);
      margin-top: 0.35rem;
      font-size: 0.95rem;
    }
    header .credit {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      opacity: 0.35;
      transition: opacity 0.25s ease;
      letter-spacing: 0.01em;
    }
    header .credit:hover {
      opacity: 0.9;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--bg-elevated);
      padding: 0.35rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      width: fit-content;
    }
    .tab {
      padding: 0.55rem 1.25rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text); background: var(--bg-hover); }
    .tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      margin-bottom: 1.25rem;
      align-items: start;
    }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-wrap input::placeholder { color: var(--text-dim); }
    .search-icon {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .yield-filters {
      display: flex;
      gap: 0.35rem;
      background: var(--bg-elevated);
      padding: 0.3rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .yield-btn {
      padding: 0.4rem 0.75rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }
    .yield-btn:hover { background: var(--bg-hover); color: var(--text); }
    .yield-btn.active.high { background: var(--high-bg); color: var(--high); }
    .yield-btn.active.medium { background: var(--medium-bg); color: var(--medium); }
    .yield-btn.active.low { background: var(--low-bg); color: var(--low); }
    .yield-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .yield-dot.high { background: var(--high); }
    .yield-dot.medium { background: var(--medium); }
    .yield-dot.low { background: var(--low); }

    .sort-select {
      padding: 0.45rem 0.75rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* Tag filter panel */
    .tag-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      margin-bottom: 1.25rem;
    }
    .tag-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .tag-panel-header h3 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .clear-tags {
      font-size: 0.8rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
    }
    .clear-tags:hover { text-decoration: underline; }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .tag-chip {
      padding: 0.3rem 0.7rem;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .tag-chip:hover { border-color: var(--accent); color: var(--text); }
    .tag-chip.selected {
      background: var(--accent-soft);
      color: #93c5fd;
      border-color: var(--accent);
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .stats strong { color: var(--text); font-weight: 600; }

    /* Results grid */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.85rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.2rem;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .card:hover {
      border-color: #3d4f6a;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .card-title {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.35;
    }
    .yield-badge {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.22rem 0.5rem;
      border-radius: 6px;
    }
    .yield-badge.high { background: var(--high-bg); color: var(--high); }
    .yield-badge.medium { background: var(--medium-bg); color: var(--medium); }
    .yield-badge.low { background: var(--low-bg); color: var(--low); }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .card-tag {
      font-size: 0.72rem;
      padding: 0.18rem 0.5rem;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 5px;
      font-weight: 500;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .empty svg { margin-bottom: 0.75rem; opacity: 0.5; }

    /* Legend */
    .legend {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .legend h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
      color: var(--text-dim);
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4f6a; }
  </style>
</head>

"yield":"high"},{"name":"Vasa praevia","tags":["Obstetrics and gynaecology"],"yield":"low"},{"name":"Vasovagal syncope","tags":["Cardiovascular","General practice and primary healthcare"],"yield":"high"},{"name":"Venous ulcers","tags":["Cardiovascular","General practice and primary healthcare"],"yield":"high"},{"name":"Viral exanthema","tags":["Child health","General practice and primary healthcare","Infection"],"yield":"low"},{"name":"Viral gastroenteritis","tags":["Child health","General practice and primary healthcare","Infection"],"yield":"high"},{"name":"Viral hepatitides","tags":["Infection"],"yield":"high"},{"name":"Visual field defects","tags":["Child health","Ophthalmology","Endocrine and metabolic"],"yield":"medium"},{"name":"Vitamin B12 and/or folate deficiency","tags":["Gastrointestinal including liver"],"yield":"high"},{"name":"Volvulus","tags":["Child health","Clinical imaging","Surgery"],"yield":"high"},{"name":"VTE in pregnancy and puerperium","tags":["Obstetrics and gynaecology"],"yield":"low"},{"name":"Wernicke's encephalopathy","tags":["Mental health","Neurosciences"],"yield":"high"},{"name":"Whooping cough","tags":["General practice and primary healthcare","Infection"],"yield":"medium"}]};

    // Mode detection — hidden /all unlocks Presentations tab
    // Works with path (/all), query (?all), or hash (#all)
    const fullMode = /\/all\/?$/.test(location.pathname) ||
                     /[?&]all\b/.test(location.search) ||
                     location.hash.includes('all');

    // State
    let currentTab = 'conditions';
    let selectedTags = new Set();
    let activeYields = new Set(['high', 'medium', 'low']);
    let searchQuery = '';
    let sortMode = 'name-asc';

    // All unique tags (union)
    const ALL_TAGS = (() => {
      const s = new Set();
      DATA.presentations.forEach(i => i.tags.forEach(t => s.add(t)));
      DATA.conditions.forEach(i => i.tags.forEach(t => s.add(t)));
      return Array.from(s).sort((a, b) => a.localeCompare(b));
    })();

    // DOM refs
    const resultsEl = document.getElementById('results');
    const statsEl = document.getElementById('stats');
    const tagListEl = document.getElementById('tagList');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort');
    const tabsEl = document.querySelector('.tabs');

    // Hide tabs + force Conditions when not in full mode
    if (!fullMode) {
      if (tabsEl) tabsEl.style.display = 'none';
      currentTab = 'conditions';
    }

    // Render tag chips
    function renderTagChips() {
      tagListEl.innerHTML = ALL_TAGS.map(tag => {
        const selected = selectedTags.has(tag) ? 'selected' : '';
        return `<button class="tag-chip ${selected}" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)}</button>`;
      }).join('');
    }

    // Filter + sort logic
    function getFiltered() {
      let items = DATA[currentTab].slice();

      // Search
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        items = items.filter(i => i.name.toLowerCase().includes(q));
      }

      // Yield
      items = items.filter(i => activeYields.has(i.yield));

      // Tags (AND logic: item must have ALL selected tags)
      if (selectedTags.size > 0) {
        items = items.filter(i => {
          const set = new Set(i.tags);
          for (const t of selectedTags) if (!set.has(t)) return false;
          return true;
        });
      }

      // Sort
      const yieldOrder = { high: 0, medium: 1, low: 2 };
      items.sort((a, b) => {
        switch (sortMode) {
          case 'name-asc': return a.name.localeCompare(b.name);
          case 'name-desc': return b.name.localeCompare(a.name);
          case 'yield-high': return yieldOrder[a.yield] - yieldOrder[b.yield] || a.name.localeCompare(b.name);
          case 'yield-low': return yieldOrder[b.yield] - yieldOrder[a.yield] || a.name.localeCompare(b.name);
          case 'tags-desc': return b.tags.length - a.tags.length || a.name.localeCompare(b.name);
          default: return 0;
        }
      });

      return items;
    }

    function render() {
      const items = getFiltered();
      const total = DATA[currentTab].length;

      statsEl.innerHTML = `
        <span>Showing <strong>${items.length}</strong> of <strong>${total}</strong> ${currentTab}</span>
        ${selectedTags.size ? `<span>· ${selectedTags.size} tag filter${selectedTags.size > 1 ? 's' : ''} active</span>` : ''}
        ${searchQuery ? `<span>· search: “${escapeHtml(searchQuery)}”</span>` : ''}
      `;

      if (items.length === 0) {
        resultsEl.innerHTML = `
          <div class="empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <p>No matches. Try clearing filters or changing the search.</p>
          </div>`;
        return;
      }

      resultsEl.innerHTML = items.map(item => `
        <article class="card">
          <div class="card-header">
            <h2 class="card-title">${escapeHtml(item.name)}</h2>
            <span class="yield-badge ${item.yield}">${item.yield}</span>
          </div>
          <div class="card-tags">
            ${item.tags.map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    // Helpers
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    searchEl.addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      render();
    });

    sortEl.addEventListener('change', e => {
      sortMode = e.target.value;
      render();
    });

    document.getElementById('yieldFilters').addEventListener('click', e => {
      const btn = e.target.closest('.yield-btn');
      if (!btn) return;
      const y = btn.dataset.yield;
      if (activeYields.has(y)) {
        if (activeYields.size > 1) {
          activeYields.delete(y);
          btn.classList.remove('active');
        }
      } else {
        activeYields.add(y);
        btn.classList.add('active');
      }
      render();
    });

    tagListEl.addEventListener('click', e => {
      const chip = e.target.closest('.tag-chip');
      if (!chip) return;
      const tag = chip.dataset.tag;
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        chip.classList.remove('selected');
      } else {
        selectedTags.add(tag);
        chip.classList.add('selected');
      }
      render();
    });

    document.getElementById('clearTags').addEventListener('click', () => {
      selectedTags.clear();
      renderTagChips();
      render();
    });

    // Init
    renderTagChips();
    render();
  </script>
